(() => {
  'use strict';
  const N=5,adj=Array.from({length:N*N},(_,i)=>[i%N?i-1:-1,i%N<N-1?i+1:-1,i>=N?i-N:-1,i<N*(N-1)?i+N:-1].filter(j=>j>=0));
  function group(b,i){const stones=[],liberties=new Set(),seen=new Set([i]),queue=[i];while(queue.length){const q=queue.pop();stones.push(q);for(const n of adj[q])if(!b[n])liberties.add(n);else if(b[n]===b[i]&&!seen.has(n)){seen.add(n);queue.push(n);}}return{stones,liberties};}
  const key=b=>b.join('');
  function play(b,i,color,ko=null){
    if(i<0||i>=N*N||b[i])return null;const next=b.slice();next[i]=color;let captured=[];
    for(const j of adj[i])if(next[j]===3-color){const g=group(next,j);if(!g.liberties.size){captured.push(...g.stones);g.stones.forEach(q=>next[q]=0);}}
    if(!group(next,i).liberties.size||key(next)===ko)return null;
    return{board:next,captured,ko:key(b)};
  }
  function joined(b,targets){return targets.every(i=>b[i]===1)&&group(b,targets[0]).stones.includes(targets[1]);}
  function safe(b,targets,ko){if(!joined(b,targets))return false;for(let i=0;i<b.length;i++){const p=play(b,i,2,ko);if(p&&targets.some(t=>p.board[t]!==1))return false;}return true;}
  function solver(targets){
    const cache=new Map();let nodes=0;
    function win(b,color,depth,ko=null){
      nodes++;if(targets.some(t=>b[t]!==1))return false;if(safe(b,targets,ko))return true;if(depth<=0)return false;
      const k=key(b)+':'+color+':'+depth+':'+ko;if(cache.has(k))return cache.get(k);
      let result=color===2,legal=0;
      for(let i=0;i<b.length;i++){const p=play(b,i,color,ko);if(!p)continue;legal++;const ok=win(p.board,3-color,depth-1,p.ko);if(color===1&&ok){result=true;break;}if(color===2&&!ok){result=false;break;}}
      if(!legal)result=color===2?win(b,1,depth-1,key(b)):false;
      cache.set(k,result);return result;
    }
    function choices(b,color,depth,ko=null){return b.flatMap((v,i)=>{const p=play(b,i,color,ko);return p?[{i,...p,win:win(p.board,3-color,depth-1,p.ko)}]:[];});}
    return{win,choices,get nodes(){return nodes;}};
  }
  const api={N,adj,group,key,play,joined,safe,solver};
  if(typeof module!=='undefined')module.exports=api;else window.GoTactics=api;
})();

    }return best;
  }

  function finishPointer(e,cancelled=false){
